<!-- app/templates/change_password.html -->
{% extends "base.html" %}

{% block content %}
<h2>修改密码</h2>
<form method="POST">
    {{ form.hidden_tag() }}
    <div class="form-group">
        {{ form.current_password.label }}<br>
        {{ form.current_password() }}
    </div>
    <div class="form-group">
        {{ form.new_password.label }}<br>
        {{ form.new_password() }}
    </div>
    <div class="form-group">
        {{ form.confirm_password.label }}<br>
        {{ form.confirm_password() }}
    </div>
    <div class="form-group">
        {{ form.submit() }}
    </div>
</form>
{% endblock %}
